version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cantor_db
    environment:
      POSTGRES_DB: cantor
      POSTGRES_USER: cantor
      POSTGRES_PASSWORD: cantor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: cantor_app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cantor
      SPRING_DATASOURCE_USERNAME: cantor
      SPRING_DATASOURCE_PASSWORD: cantor

volumes:
  postgres_data:
